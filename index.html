<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#f8f1eb">

    <title>Nasze Wesele ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #fffdfb 0%, #f8f1eb 45%, #eee3da 100%);

            color: #3c3430;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .page {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .heart {
            font-size: 58px;
            margin-bottom: 22px;

            animation: pulse 2s infinite;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(36px, 10vw, 52px);
            font-weight: 500;
            line-height: 1.05;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 17px;
            line-height: 1.55;
            color: #766b65;
            margin-bottom: 38px;
        }

        .button {
            width: 100%;
            min-height: 62px;

            border: none;
            border-radius: 18px;

            font-size: 17px;
            font-weight: 600;

            margin-bottom: 15px;

            cursor: pointer;

            transition: transform 0.15s ease;
        }

        .button:active {
            transform: scale(0.97);
        }

        .upload {
            background: #b97878;
            color: white;

            box-shadow: 0 8px 25px rgba(185, 120, 120, 0.25);
        }

        .gallery {
            background: rgba(255, 255, 255, 0.75);
            color: #514641;

            border: 1px solid rgba(120, 100, 90, 0.12);
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9a8e87;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-height: 650px) {
            .heart {
                font-size: 45px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitle {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="heart">❤️</div>

        <h1>Nasze Wesele</h1>

        <p class="subtitle">
            Cieszymy się, że jesteście z nami!<br>
            Podzielcie się z nami zdjęciami<br>
            z tego wyjątkowego dnia.
        </p>

        <button class="button upload" onclick="showMessage()">
            📸&nbsp;&nbsp; DODAJ ZDJĘCIA
        </button>

        <button class="button gallery" onclick="showGalleryMessage()">
            🖼️&nbsp;&nbsp; ZOBACZ GALERIĘ
        </button>

        <div class="footer">
            Dziękujemy, że tworzycie z nami te wspomnienia ❤️
        </div>

    </main>

    <script>
        function showMessage() {
            alert("Dodawanie zdjęć podłączymy tutaj w kolejnym kroku 📸");
        }

        function showGalleryMessage() {
            alert("Galeria będzie dostępna tutaj 🖼️");
        }
    </script>

</body>
</html>
